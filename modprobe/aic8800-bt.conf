# AIC8800D80 Bluetooth - use the standard in-kernel btusb driver.
#
# The aic_load_fw module uploads the BT firmware to the chip at boot/hotplug;
# after that, the controller speaks standard HCI over USB and the kernel's
# btusb driver manages it, registering hci0 with BlueZ.
#
# btusb already auto-binds via the USB Bluetooth class (0xe0/0x01/0x01),
# but explicit aliases ensure it is loaded even on distros that lazy-load by
# class only after another driver claims the interface first.

alias usb:v0A69Cp8D83d*dc*dsc*dp*icE0isc01ip01in* btusb
alias usb:v0A69Cp8D81d*dc*dsc*dp*icE0isc01ip01in* btusb
alias usb:v368Bp8D81d*dc*dsc*dp*icE0isc01ip01in* btusb
